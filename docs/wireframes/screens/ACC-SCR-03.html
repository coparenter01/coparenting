<div style="min-height: 900px; display: flex; flex-direction: column">

<form style="width: 100%; max-width: 440px; box-sizing: border-box; padding: 32px; background: #FFFFFF; border: 1px solid #D9DDE1; border-radius: 12px; display: flex; flex-direction: column; gap: 20px">
<div style="display: flex; flex-direction: column; gap: 6px">
<h1 style="margin: 0; font-size: 28px; font-weight: 700">Enter your code</h1>
<p style="margin: 0; font-size: 15px; color: #4E5966">We sent a 6-digit code to <strong style="color: #17212B">n•••@e••••.com</strong>. It works once and expires in 10 minutes.</p>
</div>
<fieldset style="margin: 0; padding: 0; border: 0; display: flex; flex-direction: column; gap: 8px">
<legend style="font-size: 14px; font-weight: 600; margin-bottom: 8px">Send code by</legend>
<label style="display: flex; align-items: center; gap: 8px; font-size: 15px"><input checked="" name="ch" type="radio"/> Email</label>
<label style="display: flex; align-items: center; gap: 8px; font-size: 15px"><input name="ch" type="radio"/> Text message (only if your mobile number is verified)</label>
</fieldset>
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 600">One-time code
<input autocomplete="one-time-code" inputmode="numeric" maxlength="6" style="padding: 12px; font-size: 24px; letter-spacing: 0.4em; border: 1px solid #C7CDD3; border-radius: 8px" type="text"/>
</label>
<div role="alert" style="padding: 10px 12px; border-radius: 8px; background: #FBEDE6; color: #7A2E0E; font-size: 14px">Example error: That code did not work or has expired. Check it or ask for a new code.</div>
<a href="ACC-SCR-08.html" style="display: block; text-align: center; min-height: 44px; box-sizing: border-box; padding: 12px 20px; border-radius: 8px; background: #0E5A63; color: #FFFFFF; font-size: 16px; font-weight: 600; text-decoration: none">Verify</a>
<div style="display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px; font-size: 14px">
<button style="padding: 0; border: 0; background: none; color: #0E5A63; text-decoration: underline; cursor: pointer; min-height: 44px" type="button">Resend code</button>
<a href="ACC-SCR-02.html" style="align-self: center">Back to sign in</a>
</div>
</form>
