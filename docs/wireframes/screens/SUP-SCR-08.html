<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SUP-SCR-08 · Request form on sign-in page</title>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<style>
body{margin:0;font-family:'Public Sans',system-ui,sans-serif;color:#17212B;background:#F5F6F3}
a{color:#0E5A63}a:hover{color:#09434A}
input,select,textarea,button{font:inherit}
th{text-align:left;font-size:13px;font-weight:600;color:#4E5966;padding:10px 12px;border-bottom:1px solid #D9DDE1}
td{font-size:14px;padding:12px;border-bottom:1px solid #EEF1F4;vertical-align:top}
</style>
</head>
<body>
<div style="min-height: 900px; display: flex; flex-direction: column">
<header style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px; padding: 16px 32px; background: #FFFFFF; border-bottom: 1px solid #D9DDE1">
<span style="font-size: 18px; font-weight: 700">ParentPath</span>
<nav aria-label="Public" style="display: flex; gap: 20px; font-size: 14px"><a href="SAF-SCR-05.html">Safety resources</a><a href="SUP-SCR-01.html">Help</a><a href="ACC-SCR-02.html">Sign in</a></nav>
</header>
<main style="flex: 1; width: 100%; max-width: 720px; box-sizing: border-box; margin: 0 auto; padding: 48px 16px; display: flex; flex-direction: column; gap: 20px; align-items: stretch">
<a href="ACC-SCR-02.html" style="font-size: 14px">← Back to sign in</a>
<div style="display: flex; flex-direction: column; gap: 6px"><h1 style="margin: 0; font-size: 28px; font-weight: 700">Ask for help</h1><p style="margin: 0; font-size: 15px; color: #4E5966">Use this if you cannot get into your account. We reply by email.</p></div>
<div style="padding: 12px 14px; border-radius: 8px; background: #FFF7E8; color: #5C3D06; font-size: 14px; line-height: 1.5">Do not write passwords, full Social Security numbers or card numbers in your request.</div>
<form style="box-sizing: border-box; padding: 24px; background: #FFFFFF; border: 1px solid #D9DDE1; border-radius: 12px; display: flex; flex-direction: column; gap: 14px">
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 600">Email address<input style="padding: 11px; border: 1px solid #C7CDD3; border-radius: 8px; background: #FFFFFF" type="email"/><span style="font-size: 12px; font-weight: 400; color: #4E5966">We use this to reply to you</span></label>
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 600">Category<select style="padding: 11px; border: 1px solid #C7CDD3; border-radius: 8px; background: #FFFFFF"><option>Choose a category</option><option>Account and sign-in</option><option>Messages and calls</option><option>Calendar and expenses</option><option>Records and exports</option><option>Child support link</option><option>Safety</option><option>Something else</option></select></label>
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 600">Subject<input maxlength="120" style="padding: 11px; border: 1px solid #C7CDD3; border-radius: 8px; background: #FFFFFF" type="text"/><span style="font-size: 12px; font-weight: 400; color: #4E5966">1 to 120 characters</span></label>
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 600">Description<textarea maxlength="5000" rows="5" style="padding: 11px; border: 1px solid #C7CDD3; border-radius: 8px; background: #FFFFFF"></textarea><span style="font-size: 12px; font-weight: 400; color: #4E5966">1 to 5,000 characters</span></label>
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 600">Attachments (optional)<input multiple="" style="padding: 11px; border: 1px solid #C7CDD3; border-radius: 8px; background: #FFFFFF" type="file"/><span style="font-size: 12px; font-weight: 400; color: #4E5966">Up to 3 files, 10 MB in all · JPG, PNG, PDF or DOCX</span></label>
<div style="display: flex; flex-wrap: wrap; align-items: center; justify-content: flex-start; gap: 12px"><button style="min-height: 44px; box-sizing: border-box; padding: 10px 18px; border-radius: 8px; font-weight: 600; font-size: 15px; border: 0; background: #0E5A63; color: #FFFFFF; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center" type="button">Submit request</button><a href="ACC-SCR-02.html" style="min-height: 44px; box-sizing: border-box; padding: 10px 18px; border-radius: 8px; font-weight: 600; font-size: 15px; border: 0; background: none; color: #0E5A63; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center">Back to sign in</a></div>
</form>

</main>

</div>

</body>
</html>
