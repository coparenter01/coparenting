<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ACC-SCR-01 · Create account</title>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<style>
body{margin:0;font-family:'Public Sans',system-ui,sans-serif;color:#17212B;background:#F5F6F3}
a{color:#0E5A63}a:hover{color:#09434A}
input,select,textarea,button{font:inherit}
</style>
</head>
<body>
<div style="min-height: 900px; display: flex; flex-direction: column">
<header style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px; padding: 16px 32px; background: #FFFFFF; border-bottom: 1px solid #D9DDE1">
<span style="font-size: 18px; font-weight: 700">ParentPath</span>
<nav aria-label="Public" style="display: flex; gap: 20px; font-size: 14px"><a href="SAF-SCR-05.html">Safety resources</a><a href="SUP-SCR-01.html">Help</a></nav>
</header>
<main style="flex: 1; display: flex; justify-content: center; align-items: flex-start; padding: 64px 16px">
<form style="width: 100%; max-width: 440px; box-sizing: border-box; padding: 32px; background: #FFFFFF; border: 1px solid #D9DDE1; border-radius: 12px; display: flex; flex-direction: column; gap: 20px">
<div style="display: flex; flex-direction: column; gap: 6px">
<h1 style="margin: 0; font-size: 28px; font-weight: 700">Create your account</h1>
<p style="margin: 0; font-size: 15px; color: #4E5966">You can invite your co-parent or use the app on your own after this step.</p>
</div>
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 600">Email
<input placeholder="name@example.com" required="" style="padding: 12px; font-size: 16px; border: 1px solid #C7CDD3; border-radius: 8px" type="email"/>
</label>
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 600">Display name
<input maxlength="60" required="" style="padding: 12px; font-size: 16px; border: 1px solid #C7CDD3; border-radius: 8px" type="text"/>
<span style="font-size: 13px; font-weight: 400; color: #4E5966">1 to 60 characters. Your co-parent sees this name.</span>
</label>
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 600">Password
<input minlength="8" required="" style="padding: 12px; font-size: 16px; border: 1px solid #C7CDD3; border-radius: 8px" type="password"/>
<span style="font-size: 13px; font-weight: 400; color: #4E5966">At least 8 characters.</span>
</label>
<div role="alert" style="padding: 10px 12px; border-radius: 8px; background: #FBEDE6; color: #7A2E0E; font-size: 14px">Example error: This email is already used for an account. Sign in, or use a different email.</div>
<a href="ACC-SCR-14.html" style="display: block; text-align: center; min-height: 44px; box-sizing: border-box; padding: 12px 20px; border-radius: 8px; background: #0E5A63; color: #FFFFFF; font-size: 16px; font-weight: 600; text-decoration: none">Create account</a>
<p style="margin: 0; font-size: 14px; text-align: center; color: #4E5966">Already have an account? <a href="ACC-SCR-02.html">Sign in</a></p>
</form>
</main>
</div>
<div class="pp-wf-bar" style="position: fixed; right: 12px; bottom: 12px; z-index: 50; display: flex; gap: 12px; align-items: center; padding: 8px 12px; border-radius: 10px; background: #17212B; color: #FFFFFF; font: 13px 'Public Sans', system-ui, sans-serif; box-shadow: 0 4px 16px rgba(0,0,0,.2)"><strong>ACC-SCR-01</strong><a href="../index.html" style="color:#BFE3E3">Index</a><a style="color:#BFE3E3" href="ACC-SCR-02.html">Next →</a></div>
</body>
</html>
