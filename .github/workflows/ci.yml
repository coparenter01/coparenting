name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Format, lint, types, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage
          retention-days: 7

  functions:
    name: Edge Function tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno lint supabase/functions
      - run: deno fmt --check supabase/functions
      - run: deno test --allow-env --allow-net supabase/functions

  security:
    name: Dependencies, licences, secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high --omit=dev
      - run: npx --yes license-checker-rseidelsohn --production --onlyAllow "MIT;Apache-2.0;BSD-2-Clause;BSD-3-Clause;ISC;0BSD;CC0-1.0;Unlicense;BlueOak-1.0.0;Python-2.0"
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  e2e:
    name: E2E, accessibility and RLS (dev project)
    runs-on: ubuntu-latest
    needs: quality
    env:
      SUPABASE_URL: ${{ secrets.DEV_SUPABASE_URL }}
      SUPABASE_PUBLISHABLE_KEY: ${{ secrets.DEV_SUPABASE_PUBLISHABLE_KEY }}
      TEST_PARENT_EMAIL: ${{ secrets.TEST_PARENT_EMAIL }}
      TEST_PARENT_PASSWORD: ${{ secrets.TEST_PARENT_PASSWORD }}
      TEST_COPARENT_EMAIL: ${{ secrets.TEST_COPARENT_EMAIL }}
      TEST_COPARENT_PASSWORD: ${{ secrets.TEST_COPARENT_PASSWORD }}
      TEST_OTHER_HOUSEHOLD_EMAIL: ${{ secrets.TEST_OTHER_HOUSEHOLD_EMAIL }}
      TEST_OTHER_HOUSEHOLD_PASSWORD: ${{ secrets.TEST_OTHER_HOUSEHOLD_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:rls
      - run: npm run e2e
      - run: npm run screens:coverage:strict
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
